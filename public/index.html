<head>

<title>Shopy Trend</title>

<style>
:root{--bg:#000;--surface:#0b0b0b;--line:#2c2517;--text:#f3efe6;--muted:#a79f8e;--gold:#cfa94f;--gold-soft:#e6cc82;--err:#ff9d94;--pad:20px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 Jost,"Helvetica Neue",Arial,sans-serif;padding-bottom:130px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.tote{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.top{text-align:center;padding:52px var(--pad) 8px;color:var(--gold);animation:rise .9s ease both}
.mark{margin:0;font:700 clamp(32px,9.5vw,60px)/1 "Bodoni Moda",Didot,"Bodoni 72",Georgia,serif;letter-spacing:.14em;text-transform:uppercase}
.tote{width:36px;height:36px;margin-top:16px}
.lead{max-width:34ch;margin:18px auto 34px;padding:0 var(--pad);text-align:center;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr;gap:28px;max-width:1000px;margin:0 auto;padding:0 var(--pad);align-items:start}
@media(min-width:720px){.grid{grid-template-columns:repeat(2,1fr);gap:32px}}
.card{background:var(--surface);border:1px solid var(--line)}
.media{overflow:hidden;background:#111;border-bottom:1px solid var(--line)}
.media img{display:block;width:100%;height:100%;object-fit:cover}
.cbody{display:flex;flex-direction:column;gap:10px;padding:16px}
.pname{margin:0;font:500 22px/1.2 "Bodoni Moda",Didot,Georgia,serif}
.note{margin:-4px 0 0;font-size:14px;color:var(--muted)}
.price{margin:0;font-size:19px;font-weight:500;color:var(--gold)}
.pick-label{margin:6px 0 0;font-size:14px;color:var(--muted)}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:44px;min-height:44px;padding:0 14px;background:transparent;border:1px solid var(--line);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#000}
.hint{margin:0;min-height:1.3em;font-size:14px;color:var(--err)}
.btn{min-height:50px;padding:0 18px;background:transparent;border:1px solid var(--gold);color:var(--gold);cursor:pointer;font-weight:500}
.btn.solid{background:var(--gold);color:#000}
.foot{max-width:44ch;margin:40px auto 0;padding:0 var(--pad);text-align:center;font-size:14px;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar[hidden],.overlay[hidden],.link[hidden],.walink[hidden]{display:none}
.bar-info{display:flex;flex-direction:column;line-height:1.25}
.bar-total{font-size:20px;font-weight:500;color:var(--gold)}
.bar-count{font-size:14px;color:var(--muted)}
.overlay{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.78)}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:20px var(--pad) calc(20px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-bottom:0;animation:slide .22s ease both}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-title{margin:0;font:500 24px/1.2 "Bodoni Moda",Didot,Georgia,serif;color:var(--gold)}
.sheet-title:focus{outline:none}
.link{min-height:44px;padding:0 4px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer}
.walink{display:block;margin-top:14px;text-align:center;color:var(--gold-soft)}
.lines{margin:12px 0 0;padding:0;list-style:none}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.line-name{margin:0}
.line-sub{margin:0;font-size:14px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:44px;height:44px;background:transparent;border:1px solid var(--line);cursor:pointer;font-size:20px;line-height:1}
.qty span{min-width:26px;text-align:center}
.total{display:flex;justify-content:space-between;padding:16px 0;font-size:20px;font-weight:500;color:var(--gold)}
.field{display:block;margin-bottom:14px}
.field span{display:block;margin-bottom:6px;font-size:14px;color:var(--muted)}
.field input{width:100%;min-height:50px;padding:0 12px;background:var(--bg);border:1px solid var(--line);font-size:16px}
.field input:focus{border-color:var(--gold)}
.err{min-height:1.3em;margin:0 0 10px;font-size:14px;color:var(--err)}
.sheet .btn{width:100%}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slide{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.top,.sheet{animation:none}}
</style>
</head>

  var NL = String.fromCharCode(10);
  var cart = [];
  var chosen = {};
  var lastSent = "";

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function money(n) {
    return C.currency === "USD" ? n + " $" : n.toLocaleString("fr-FR") + " FC";
  }
  function byId(id) {
    for (var i = 0; i < C.products.length; i++) if (C.products[i].id === id) return C.products[i];
  }
  function totals() {
    var n = 0, t = 0;
    cart.forEach(function (l) { n += l.qty; t += l.qty * byId(l.pid).price; });
    return { n: n, t: t };
  }

  function renderGrid() {
    var g = $("grid");
    C.products.forEach(function (p) {
      var card = el("article", "card");
      var media = el("div", "media");
      media.style.aspectRatio = p.ratio || "3 / 4";
      var im = document.createElement("img");
      im.src = p.image; im.alt = p.name; im.decoding = "async";
      media.appendChild(im);
      card.appendChild(media);

      var body = el("div", "cbody");
      body.appendChild(el("h2", "pname", p.name));
      if (p.note) body.appendChild(el("p", "note", p.note));
      body.appendChild(el("p", "price", money(p.price)));

      var hint = el("p", "hint", "");
      hint.setAttribute("role", "status");

      if (p.choice) {
        body.appendChild(el("p", "pick-label", p.choice.label));
        var opts = el("div", "sizes");
        opts.setAttribute("role", "group");
        opts.setAttribute("aria-label", p.choice.label);
        p.choice.values.forEach(function (v) {
          var b = el("button", "chip", v);
          b.type = "button";
          b.setAttribute("aria-pressed", "false");
          b.addEventListener("click", function () {
            chosen[p.id] = v;
            Array.prototype.forEach.call(opts.children, function (c) {
              c.setAttribute("aria-pressed", c === b ? "true" : "false");
            });
            hint.textContent = "";
          });
          opts.appendChild(b);
        });
        body.appendChild(opts);
      }
      body.appendChild(hint);

      var add = el("button", "btn solid", "Ajouter");
      add.type = "button";
      add.addEventListener("click", function () {
        var opt = "";
        if (p.choice) {
          if (!chosen[p.id]) { hint.textContent = p.choice.prompt; return; }
          opt = chosen[p.id];
        }
        addToCart(p.id, opt);
        add.textContent = "Ajouté";
        setTimeout(function () { add.textContent = "Ajouter"; }, 1200);
      });
      body.appendChild(add);
      card.appendChild(body);
      g.appendChild(card);
    });
  }

  function addToCart(pid, opt) {
    for (var i = 0; i < cart.length; i++) {
      if (cart[i].pid === pid && cart[i].opt === opt) { cart[i].qty++; update(); return; }
    }
    cart.push({ pid: pid, opt: opt, qty: 1 });
    update();
  }
  function changeQty(i, d) {
    cart[i].qty += d;
    if (cart[i].qty <= 0) cart.splice(i, 1);
    update();
  }

  function renderLines() {
    var ul = $("lines");
    ul.innerHTML = "";
    cart.forEach(function (l, i) {
      var p = byId(l.pid);
      var li = el("li", "line");
      var info = el("div");
      info.appendChild(el("p", "line-name", p.name + (l.opt ? " (" + l.opt + ")" : "")));
      info.appendChild(el("p", "line-sub", money(l.qty * p.price)));
      li.appendChild(info);
      var q = el("div", "qty");
      var minus = el("button", "", "\u2212"); minus.type = "button";
      minus.setAttribute("aria-label", "Retirer un " + p.name);
      minus.addEventListener("click", function () { changeQty(i, -1); });
      var plus = el("button", "", "+"); plus.type = "button";
      plus.setAttribute("aria-label", "Ajouter un " + p.name);
      plus.addEventListener("click", function () { changeQty(i, 1); });
      q.appendChild(minus); q.appendChild(el("span", "", String(l.qty))); q.appendChild(plus);
      li.appendChild(q);
      ul.appendChild(li);
    });
  }

  function update() {
    var s = totals();
    $("bar").hidden = s.n === 0;
    $("barTotal").textContent = money(s.t);
    $("barCount").textContent = s.n + " article" + (s.n > 1 ? "s" : "");
    $("sheetTotal").textContent = money(s.t);
    if (!$("overlay").hidden) {
      if (s.n === 0) closeSheet(); else renderLines();
    }
  }

  function openSheet() {
    renderLines();
    $("err").textContent = "";
    $("waLink").hidden = true;
    $("overlay").hidden = false;
    document.body.style.overflow = "hidden";
    $("sheetTitle").focus();
  }
  function closeSheet() {
    $("overlay").hidden = true;
    document.body.style.overflow = "";
    $("openSheet").focus();
  }

  function send() {
    var name = $("fName").value.trim();
    var addr = $("fAddr").value.trim();
    if (!cart.length) return;
    if (!name || !addr) { $("err").textContent = "Indiquez votre nom et votre adresse de livraison."; return; }
    var lines = ["Bonjour " + C.brand + ", je souhaite commander :", ""];
    cart.forEach(function (l) {
      var p = byId(l.pid);
      lines.push("- " + l.qty + " x " + p.name + (l.opt ? " (" + p.choice.label + " : " + l.opt + ")" : "") + " : " + money(l.qty * p.price));
    });
    lines.push("", "Total : " + money(totals().t), "", "Nom : " + name, "Adresse : " + addr);
    var url = "https://wa.me/" + String(C.whatsapp).replace(/[^0-9]/g, "") + "?text=" + encodeURIComponent(lines.join(NL));
    var key = JSON.stringify([cart, name, addr]);
    if (key !== lastSent) {
      lastSent = key;
      var items = cart.map(function (l) {
        var pr = byId(l.pid);
        return { name: pr.name, option: l.opt ? pr.choice.label + " : " + l.opt : "", qty: l.qty, price: pr.price };
      });
      try {
        fetch("/api/order", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ name: name, address: addr, items: items }),
          keepalive: true
        }).catch(function () {});
      } catch (e) {}
    }
    var a = $("waLink");
    a.href = url;
    a.hidden = false;
    try { window.open(url, "_blank"); } catch (e) {}
  }

  $("openSheet").addEventListener("click", openSheet);
  $("closeSheet").addEventListener("click", closeSheet);
  $("overlay").addEventListener("click", function (e) { if (e.target === $("overlay")) closeSheet(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("overlay").hidden) closeSheet(); });
  $("send").addEventListener("click", send);

  renderGrid();
})();
</script>
</body>
</html>
